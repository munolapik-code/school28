<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Електронний журнал — Школа №28</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Іконки -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDK (Compat версії) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- ВІКНО ВХОДУ -->
  <div id="login-screen" class="fixed inset-0 bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900 flex items-center justify-center p-4 z-50">
    <div class="glass max-w-md w-full p-8 rounded-2xl shadow-2xl border border-white/20 text-center">
      <div class="w-20 h-20 bg-blue-600 text-white rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-lg">
        <i class="fa-solid fa-school"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 mb-1">Електронний журнал</h1>
      <h2 class="text-lg font-medium text-blue-600 mb-6">Школа №28</h2>

      <form id="login-form" class="space-y-4 text-left">
        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-700">Логін</label>
          <input type="text" id="login-input" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition" placeholder="Введіть логін">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-700">Пароль</label>
          <input type="password" id="password-input" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition" placeholder="Введіть пароль">
        </div>

        <div id="login-error" class="hidden p-3 bg-red-100 border border-red-300 text-red-700 text-sm rounded-xl text-center font-medium">
          Невірний логін або пароль
        </div>

        <button type="submit" id="login-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i> Увійти
        </button>
      </form>
    </div>
  </div>

  <!-- ОСНОВНИЙ ДОДАТОК -->
  <div id="app-screen" class="hidden flex flex-col min-h-screen">
    
    <!-- ВЕРХНЯ ПАНЕЛЬ (ШАПКА) -->
    <header class="bg-white shadow-md border-b sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="bg-blue-600 text-white p-2.5 rounded-xl text-xl shadow">
            <i class="fa-solid fa-school"></i>
          </div>
          <div>
            <h1 class="font-bold text-slate-900 leading-tight">Школа №28</h1>
            <p class="text-xs text-slate-500 font-medium">Електронний журнал</p>
          </div>
        </div>

        <!-- Профіль користувача -->
        <div class="flex items-center gap-3 relative">
          <div class="text-right hidden sm:block">
            <div id="user-display-name" class="font-bold text-sm text-slate-800">—</div>
            <div id="user-display-role" class="text-xs text-blue-600 font-semibold uppercase tracking-wider">—</div>
          </div>
          <button onclick="toggleSettingsModal()" class="w-10 h-10 bg-slate-200 hover:bg-slate-300 rounded-full flex items-center justify-center text-slate-700 font-bold transition shadow-sm border border-slate-300">
            <i class="fa-solid fa-user"></i>
          </button>
          <button onclick="logout()" title="Вийти з облікового запису" class="text-slate-400 hover:text-red-600 p-2 text-lg transition ml-1">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- ОСНОВНИЙ КОНТЕНТ -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
      
      <!-- Панель з привітанням та кнопками навігації -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h2 id="welcome-message" class="text-xl font-bold text-slate-900">Вітаємо!</h2>
          <p id="welcome-sub" class="text-sm text-slate-500">Панель керування електронним журналом</p>
        </div>

        <!-- Кнопки керування (динамічні) -->
        <div class="flex flex-wrap items-center gap-2">
          <button id="btn-back" onclick="showMainDashboard()" class="hidden px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-semibold rounded-xl transition flex items-center gap-2">
            <i class="fa-solid fa-arrow-left"></i> Назад на головну
          </button>

          <!-- Кнопки для Директора -->
          <div id="director-nav" class="hidden flex flex-wrap gap-2">
            <button onclick="showTeachersSection()" class="px-3.5 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 text-sm font-semibold rounded-xl transition flex items-center gap-1.5 border border-blue-200">
              <i class="fa-solid fa-chalkboard-user"></i> Вчителі
            </button>
            <button onclick="showStudentsSection()" class="px-3.5 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-sm font-semibold rounded-xl transition flex items-center gap-1.5 border border-indigo-200">
              <i class="fa-solid fa-user-graduate"></i> Учні
            </button>
            <button onclick="openAddClassModal()" class="px-3.5 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-sm font-semibold rounded-xl transition flex items-center gap-1.5 border border-emerald-200">
              <i class="fa-solid fa-plus"></i> Додати клас
            </button>
            <button onclick="showScheduleSection()" class="px-3.5 py-2 bg-amber-50 hover:bg-amber-100 text-amber-700 text-sm font-semibold rounded-xl transition flex items-center gap-1.5 border border-amber-200">
              <i class="fa-solid fa-calendar-days"></i> Розклад
            </button>
            <button onclick="showSubjectsSection()" class="px-3.5 py-2 bg-purple-50 hover:bg-purple-100 text-purple-700 text-sm font-semibold rounded-xl transition flex items-center gap-1.5 border border-purple-200">
              <i class="fa-solid fa-book"></i> Предмети
            </button>
          </div>

          <!-- Кнопки для Вчителя -->
          <div id="teacher-nav" class="hidden flex flex-wrap gap-2">
            <button onclick="showScheduleSection()" class="px-3.5 py-2 bg-amber-50 hover:bg-amber-100 text-amber-700 text-sm font-semibold rounded-xl transition flex items-center gap-1.5 border border-amber-200">
              <i class="fa-solid fa-calendar-days"></i> Розклад
            </button>
          </div>
        </div>
      </div>

      <!-- ВІДЖЕТИ / СЕКЦІЇ -->
      <div id="content-area"></div>

    </main>
  </div>

  <!-- МОДАЛЬНІ ВІКНА -->

  <!-- Налаштування / Зміна пароля -->
  <div id="modal-settings" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white max-w-md w-full rounded-2xl p-6 shadow-2xl border space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-gear text-blue-600 mr-2"></i>Налаштування профілю</h3>
        <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Новий пароль</label>
        <input type="password" id="new-password-input" class="w-full px-4 py-2 rounded-xl border focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Введіть новий пароль">
        <p id="change-pass-msg" class="text-xs mt-1 text-slate-500"></p>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="toggleSettingsModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700 font-medium text-sm">Скасувати</button>
        <button onclick="saveNewPassword()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium text-sm shadow">Зберегти</button>
      </div>
    </div>
  </div>

  <!-- Додати/Редагувати користувача (Вчитель / Учень) -->
  <div id="modal-user" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white max-w-md w-full rounded-2xl p-6 shadow-2xl border space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modal-user-title" class="text-lg font-bold text-slate-800">Користувач</h3>
        <button onclick="closeUserModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <input type="hidden" id="edit-user-id">
      <input type="hidden" id="edit-user-role">
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Ім'я та Прізвище</label>
          <input type="text" id="user-fullname" class="w-full px-3 py-2 rounded-xl border text-sm" placeholder="Іван Іванов">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Логін</label>
            <input type="text" id="user-login" class="w-full px-3 py-2 rounded-xl border text-sm" placeholder="Логін">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Пароль</label>
            <input type="password" id="user-password" class="w-full px-3 py-2 rounded-xl border text-sm" placeholder="Пароль">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Клас</label>
          <select id="user-class-select" class="w-full px-3 py-2 rounded-xl border text-sm bg-white"></select>
        </div>
        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="user-allow-pass" class="w-4 h-4 text-blue-600 rounded">
          <label for="user-allow-pass" class="text-xs text-slate-700 font-medium">Дозволити змінювати пароль</label>
        </div>
        <!-- НОВЕ ПОЛЕ: Галочка заблокувати акаунт -->
        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="user-is-blocked" class="w-4 h-4 text-red-600 rounded">
          <label for="user-is-blocked" class="text-xs text-red-600 font-semibold">Заблокувати акаунт</label>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeUserModal()" class="px-4 py-2 bg-slate-100 rounded-xl text-slate-700 font-medium text-sm">Скасувати</button>
        <button onclick="saveUserFromModal()" class="px-4 py-2 bg-blue-600 text-white rounded-xl font-medium text-sm shadow">Зберегти</button>
      </div>
    </div>
  </div>

  <!-- Додати клас -->
  <div id="modal-add-class" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white max-w-md w-full rounded-2xl p-6 shadow-2xl border space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-users-rectangle text-emerald-600 mr-2"></i>Додати клас</h3>
        <button onclick="closeAddClassModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Назва класу</label>
        <input type="text" id="class-name-input" class="w-full px-4 py-2 rounded-xl border focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Наприклад: 5-А або 10-Б">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeAddClassModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700 font-medium text-sm">Скасувати</button>
        <button onclick="saveClass()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium text-sm shadow">Додати</button>
      </div>
    </div>
  </div>

  <!-- ЛОГІКА ТА FIREBASE -->
  <script>
    // КОНФІГУРАЦІЯ FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyDJsIf3QP9Dq8cuTjFGouaofunlljQ-SIg",
      authDomain: "school28journal.firebaseapp.com",
      projectId: "school28journal",
      storageBucket: "school28journal.firebasestorage.app",
      messagingSenderId: "485871753335",
      appId: "1:485871753335:web:35710b010800d35c9f0e72"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let DB = {
      users: [],
      classes: [],
      schedules: {},
      subjects: [],
      grades: {}
    };

    let currentUser = null;
    let currentOpenClass = null;

    // ДОПОМІЖНА ФУНКЦІЯ ДЛЯ ОТРИМАННЯ ПОТОЧНОЇ ДАТИ У ФОРМАТІ YYYY-MM-DD
    function getTodayDateString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // ЗАВАНТАЖЕННЯ ТА СИНХРОНІЗАЦІЯ З ХМАРОЮ
    async function syncDataFromCloud(callback) {
      try {
        const docRef = db.collection("schoolData").doc("mainDoc");
        const doc = await docRef.get();
        if (doc.exists) {
          DB = doc.data();
        } else {
          DB = {
            users: [],
            classes: [],
            schedules: {},
            subjects: [],
            grades: {}
          };
          await docRef.set(DB);
        }
        if (callback) callback();
      } catch (err) {
        console.error("Помилка мережі або бази: ", err);
      }
    }

    async function saveToCloud() {
      try {
        await db.collection("schoolData").doc("mainDoc").set(DB);
      } catch (err) {
        console.error("Помилка збереження: ", err);
      }
    }

    // ВХІД З ПЕРЕВІРКОЮ БЛОКУВАННЯ
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errorDiv = document.getElementById('login-error');
      btn.innerText = "Завантаження...";
      
      const login = document.getElementById('login-input').value.trim();
      const pass = document.getElementById('password-input').value.trim();
      
      await syncDataFromCloud(() => {
        const user = DB.users.find(u => u.login === login && u.password === pass);
        btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Увійти`;

        if (user) {
          // ПЕРЕВІРКА НА БЛОКУВАННЯ
          if (user.isBlocked) {
            errorDiv.innerText = "Акаунт заблоковано";
            errorDiv.classList.remove('hidden');
            return;
          }

          currentUser = user;
          errorDiv.classList.add('hidden');
          document.getElementById('login-screen').classList.add('hidden');
          document.getElementById('app-screen').classList.remove('hidden');
          initApp();
        } else {
          errorDiv.innerText = "Невірний логін або пароль";
          errorDiv.classList.remove('hidden');
        }
      });
    });

    function logout() {
      currentUser = null;
      document.getElementById('app-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('login-input').value = '';
      document.getElementById('password-input').value = '';
    }

    async function initApp() {
      await syncDataFromCloud();
      document.getElementById('user-display-name').innerText = currentUser.name;
      const roleMap = { director: 'Директор', teacher: 'Вчитель', student: 'Учень' };
      document.getElementById('user-display-role').innerText = roleMap[currentUser.role] || currentUser.role;

      const dirNav = document.getElementById('director-nav');
      const teacherNav = document.getElementById('teacher-nav');
      
      if (currentUser.role === 'director') {
        dirNav.classList.remove('hidden');
        teacherNav.classList.add('hidden');
      } else if (currentUser.role === 'teacher') {
        dirNav.classList.add('hidden');
        teacherNav.classList.remove('hidden');
      } else {
        dirNav.classList.add('hidden');
        teacherNav.classList.add('hidden');
      }

      showMainDashboard();
    }

    // ГОЛОВНИЙ ЕКРАН
    async function showMainDashboard() {
      await syncDataFromCloud();
      document.getElementById('btn-back').classList.add('hidden');
      currentOpenClass = null;

      const welcomeTitle = document.getElementById('welcome-message');
      const welcomeSub = document.getElementById('welcome-sub');
      const contentArea = document.getElementById('content-area');
      contentArea.innerHTML = '';

      if (currentUser.role === 'director' || currentUser.role === 'teacher') {
        welcomeTitle.innerText = `Вітаємо, ${currentUser.name}!`;
        welcomeSub.innerText = currentUser.role === 'director' ? 'Панель керування директора' : 'Панель керування вчителя';

        let availableClasses = DB.classes || [];
        if (currentUser.role === 'teacher') {
          availableClasses = (DB.classes || []).filter(c => currentUser.classId === c.id);
        }

        let html = `<div><h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-chalkboard text-blue-600"></i> Список класів</h3>`;

        if (availableClasses.length === 0) {
          html += `<div class="bg-white p-8 rounded-2xl shadow-sm border text-center text-slate-500"><i class="fa-solid fa-folder-open text-4xl mb-2 text-slate-300"></i><p>Немає доступних класів.</p></div>`;
        } else {
          html += `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">`;
          availableClasses.forEach(cls => {
            const studentCount = (DB.users || []).filter(u => u.role === 'student' && u.classId === cls.id).length;
            const teacherCount = (DB.users || []).filter(u => u.role === 'teacher' && u.classId === cls.id).length;

            html += `
              <div onclick="openClassView('${cls.id}')" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md hover:border-blue-300 transition cursor-pointer flex flex-col justify-between group">
                <div>
                  <div class="flex items-center justify-between mb-3">
                    <span class="text-2xl font-black text-slate-800 group-hover:text-blue-600 transition">${cls.name}</span>
                    <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-blue-600 transition"></i>
                  </div>
                  <div class="space-y-1 text-xs text-slate-500">
                    <div><i class="fa-solid fa-user-graduate mr-1"></i> Учнів: <span class="font-semibold text-slate-700">${studentCount}</span></div>
                    <div><i class="fa-solid fa-chalkboard-user mr-1"></i> Вчителів: <span class="font-semibold text-slate-700">${teacherCount}</span></div>
                  </div>
                </div>
              </div>
            `;
          });
          html += `</div>`;
        }
        html += `</div>`;
        contentArea.innerHTML = html;

      } else if (currentUser.role === 'student') {
        welcomeTitle.innerText = `Вітаємо, ${currentUser.name}!`;
        welcomeSub.innerText = 'Кабінет учня';

        const userGrades = (DB.grades && DB.grades[currentUser.id]) ? DB.grades[currentUser.id] : {};
        let goodCount = 0;
        let badCount = 0;

        Object.values(userGrades).forEach(subDates => {
          Object.values(subDates).forEach(lessons => {
            lessons.forEach(g => {
              const val = parseInt(g.grade);
              if (val >= 4) goodCount++;
              else if (val < 4) badCount++;
            });
          });
        });

        const cls = (DB.classes || []).find(c => c.id === currentUser.classId);

        html = `
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-5 rounded-2xl border shadow-sm flex items-center gap-4">
              <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-graduation-cap"></i></div>
              <div><div class="text-xs text-slate-500 font-medium">Мій клас</div><div class="text-xl font-bold text-slate-800">${cls ? cls.name : 'Не вказано'}</div></div>
            </div>
            <div class="bg-white p-5 rounded-2xl border shadow-sm flex items-center gap-4">
              <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-face-smile"></i></div>
              <div><div class="text-xs text-slate-500 font-medium">Хороші оцінки</div><div class="text-xl font-bold text-emerald-600">${goodCount}</div></div>
            </div>
            <div class="bg-white p-5 rounded-2xl border shadow-sm flex items-center gap-4">
              <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-xl flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-face-frown"></i></div>
              <div><div class="text-xs text-slate-500 font-medium">Погані оцінки</div><div class="text-xl font-bold text-rose-600">${badCount}</div></div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white p-5 rounded-2xl border shadow-sm">
              <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-star text-amber-500"></i> Мої оцінки</h3>
              <div class="space-y-3">
        `;

        (DB.subjects || []).forEach(sub => {
          const subDates = userGrades[sub] || {};
          let allSubGrades = [];
          Object.keys(subDates).forEach(dateStr => {
            subDates[dateStr].forEach(item => {
              allSubGrades.push(`${item.grade} <span class="text-[10px] text-slate-400">(${dateStr})</span>`);
            });
          });

          html += `
            <div class="p-3 bg-slate-50 rounded-xl flex items-center justify-between">
              <span class="font-medium text-sm text-slate-700">${sub}</span>
              <div class="flex flex-wrap gap-1">
                ${allSubGrades.length > 0 ? allSubGrades.map(gStr => `<span class="px-2.5 py-1 bg-blue-100 text-blue-800 text-xs font-bold rounded-lg">${gStr}</span>`).join('') : '<span class="text-xs text-slate-400">Немає оцінок</span>'}
              </div>
            </div>
          `;
        });

        html += `</div></div><div class="bg-white p-5 rounded-2xl border shadow-sm"><h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-calendar-week text-indigo-500"></i> Розклад</h3><div class="text-sm">`;
        const scheduleText = DB.schedules ? DB.schedules[currentUser.classId] : '';
        if (scheduleText) {
          html += `<div class="whitespace-pre-line bg-slate-50 p-4 rounded-xl text-slate-700">${scheduleText}</div>`;
        } else {
          html += `<p class="text-slate-400">Розклад ще не складено.</p>`;
        }
        html += `</div></div></div>`;
        contentArea.innerHTML = html;
      }
    }

    // ПРОГЛЯД ЖУРНАЛУ КЛАСУ
    async function openClassView(classId) {
      await syncDataFromCloud();
      currentOpenClass = classId;
      document.getElementById('btn-back').classList.remove('hidden');

      const cls = (DB.classes || []).find(c => c.id === classId);
      const students = (DB.users || []).filter(u => u.role === 'student' && u.classId === classId);
      const teachers = (DB.users || []).filter(u => u.role === 'teacher' && u.classId === classId);
      const today = getTodayDateString();

      document.getElementById('content-area').innerHTML = `
        <div class="space-y-6">
          <div class="bg-white p-5 rounded-2xl border shadow-sm flex items-center justify-between">
            <div>
              <h2 class="text-2xl font-black text-slate-800">Клас ${cls ? cls.name : ''}</h2>
              <p class="text-xs text-slate-500 mt-1">Учнів: <span class="font-semibold text-slate-700 mr-3">${students.length}</span> Вчителів: <span class="font-semibold text-slate-700">${teachers.length}</span></p>
            </div>
          </div>
          <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <h3 class="font-bold text-slate-800"><i class="fa-solid fa-book-open text-blue-600 mr-2"></i>Електронний журнал</h3>
              <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center gap-2">
                  <label class="text-xs font-semibold text-slate-600">Дата:</label>
                  <input type="date" id="journal-date-input" value="${today}" onchange="renderJournalTable('${classId}')" class="px-3 py-1.5 border rounded-xl text-sm bg-white font-medium">
                </div>
                <div class="flex items-center gap-2">
                  <label class="text-xs font-semibold text-slate-600">Предмет:</label>
                  <select id="journal-subject-select" onchange="renderJournalTable('${classId}')" class="px-3 py-1.5 border rounded-xl text-sm bg-white font-medium">
                    ${(DB.subjects || []).map(s => `<option value="${s}">${s}</option>`).join('')}
                  </select>
                </div>
              </div>
            </div>
            <div id="journal-table-container" class="overflow-x-auto pt-2"></div>
          </div>
        </div>
      `;
      renderJournalTable(classId);
    }

    function renderJournalTable(classId) {
      const subjectSelect = document.getElementById('journal-subject-select');
      const dateInput = document.getElementById('journal-date-input');
      
      if (!subjectSelect || !subjectSelect.value) {
        document.getElementById('journal-table-container').innerHTML = `<p class="text-center text-slate-400 py-6">Немає доданих предметів.</p>`;
        return;
      }
      
      const subject = subjectSelect.value;
      const selectedDate = dateInput ? dateInput.value : getTodayDateString();
      const container = document.getElementById('journal-table-container');
      const students = (DB.users || []).filter(u => u.role === 'student' && u.classId === classId);

      if (students.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-400 py-6">У цьому класі поки немає учнів.</p>`;
        return;
      }

      let html = `<table class="w-full text-left border-collapse min-w-[600px]"><thead><tr class="border-b bg-slate-50 text-slate-600 text-xs uppercase font-bold"><th class="p-3 w-48">Ім'я Прізвище</th>`;
      for (let i = 1; i <= 5; i++) html += `<th class="p-3 text-center w-24">Урок ${i}</th>`;
      html += `</tr></thead><tbody class="divide-y text-sm">`;

      students.forEach(st => {
        const studentGrades = (DB.grades && DB.grades[st.id] && DB.grades[st.id][subject] && DB.grades[st.id][subject][selectedDate]) ? DB.grades[st.id][subject][selectedDate] : [];
        html += `<tr class="hover:bg-slate-50/50"><td class="p-3 font-semibold text-slate-800">${st.name}</td>`;

        for (let lesson = 1; lesson <= 5; lesson++) {
          const gObj = studentGrades.find(g => g.lesson === lesson);
          const currentGrade = gObj ? gObj.grade : '';
          const canEdit = currentUser.role === 'director' || currentUser.role === 'teacher';

          html += `
            <td class="p-2 text-center">
              ${canEdit ? `
                <input type="text" maxlength="2" value="${currentGrade}" 
                  onchange="saveGrade('${st.id}', '${subject}', '${selectedDate}', ${lesson}, this.value)"
                  class="w-12 h-10 text-center font-bold border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none ${currentGrade ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-white'}" placeholder="-">
              ` : `
                <span class="font-bold text-blue-700">${currentGrade || '-'}</span>
              `}
            </td>
          `;
        }
        html += `</tr>`;
      });
      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    async function saveGrade(studentId, subject, dateStr, lesson, value) {
      if (!DB.grades) DB.grades = {};
      if (!DB.grades[studentId]) DB.grades[studentId] = {};
      if (!DB.grades[studentId][subject]) DB.grades[studentId][subject] = {};
      if (!DB.grades[studentId][subject][dateStr]) DB.grades[studentId][subject][dateStr] = [];

      const list = DB.grades[studentId][subject][dateStr];
      const existingIndex = list.findIndex(g => g.lesson === lesson);

      if (value.trim() === '') {
        if (existingIndex !== -1) list.splice(existingIndex, 1);
      } else {
        if (existingIndex !== -1) {
          list[existingIndex].grade = value.trim();
        } else {
          list.push({ lesson: lesson, grade: value.trim() });
        }
      }
      await saveToCloud();
    }

    // КЕРУВАННЯ КОРИСТУВАЧАМИ
    function openUserModal(role, userId = null) {
      if (!DB.classes || DB.classes.length === 0) { alert('Спочатку створіть хоча б один клас!'); return; }

      document.getElementById('edit-user-id').value = userId || '';
      document.getElementById('edit-user-role').value = role;
      
      const select = document.getElementById('user-class-select');
      select.innerHTML = DB.classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

      if (userId) {
        const u = DB.users.find(x => x.id === userId);
        document.getElementById('modal-user-title').innerText = `Редагувати (${role === 'teacher' ? 'Вчителя' : 'Учня'})`;
        document.getElementById('user-fullname').value = u.name;
        document.getElementById('user-login').value = u.login;
        document.getElementById('user-password').value = u.password;
        document.getElementById('user-class-select').value = u.classId || DB.classes[0].id;
        document.getElementById('user-allow-pass').checked = !!u.allowPassChange;
        document.getElementById('user-is-blocked').checked = !!u.isBlocked;
      } else {
        document.getElementById('modal-user-title').innerText = `Додати ${role === 'teacher' ? 'вчителя' : 'учня'}`;
        document.getElementById('user-fullname').value = '';
        document.getElementById('user-login').value = '';
        document.getElementById('user-password').value = '';
        document.getElementById('user-allow-pass').checked = true;
        document.getElementById('user-is-blocked').checked = false;
      }

      document.getElementById('modal-user').classList.remove('hidden');
    }

    function closeUserModal() { document.getElementById('modal-user').classList.add('hidden'); }

    async function saveUserFromModal() {
      const id = document.getElementById('edit-user-id').value;
      const role = document.getElementById('edit-user-role').value;
      const name = document.getElementById('user-fullname').value.trim();
      const login = document.getElementById('user-login').value.trim();
      const pass = document.getElementById('user-password').value.trim();
      const classId = document.getElementById('user-class-select').value;
      const allowPass = document.getElementById('user-allow-pass').checked;
      const isBlocked = document.getElementById('user-is-blocked').checked;

      if (!name || !login || !pass) { alert('Заповніть усі поля!'); return; }

      if (!DB.users) DB.users = [];

      if (id) {
        const u = DB.users.find(x => x.id === id);
        if (u) {
          u.name = name;
          u.login = login;
          u.password = pass;
          u.classId = classId;
          u.allowPassChange = allowPass;
          u.isBlocked = isBlocked;
        }
      } else {
        DB.users.push({
          id: Date.now().toString(),
          name, login, password: pass, role, classId, allowPassChange: allowPass, isBlocked
        });
      }

      await saveToCloud();
      closeUserModal();
      if (role === 'teacher') showTeachersSection();
      else showStudentsSection();
    }

    // СЕКЦІЯ ВЧИТЕЛІВ
    async function showTeachersSection() {
      await syncDataFromCloud();
      document.getElementById('btn-back').classList.remove('hidden');
      const teachers = (DB.users || []).filter(u => u.role === 'teacher');
      let html = `<div class="bg-white p-5 rounded-2xl border shadow-sm space-y-4"><div class="flex items-center justify-between"><h3 class="font-bold text-slate-800"><i class="fa-solid fa-chalkboard-user text-blue-600 mr-2"></i>Вчителі</h3><button onclick="openUserModal('teacher')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-xl transition shadow"><i class="fa-solid fa-plus mr-1"></i> Додати вчителя</button></div>`;

      if (teachers.length === 0) {
        html += `<p class="text-slate-400 text-sm">Немає вчителів.</p>`;
      } else {
        html += `<div class="divide-y">` + teachers.map(t => {
          const cls = (DB.classes || []).find(c => c.id === t.classId);
          return `
            <div class="py-3 flex items-center justify-between">
              <div>
                <div class="font-bold text-slate-800 flex items-center gap-2">
                  ${t.name}
                  ${t.isBlocked ? `<span class="text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold">Заблоковано</span>` : ''}
                </div>
                <div class="text-xs text-slate-500">Логін: <span class="font-semibold text-slate-700">${t.login}</span> | Пароль: <span class="font-semibold text-slate-700">${t.password}</span> | Клас: ${cls ? cls.name : 'Не прив\'язаний'}</div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="openUserModal('teacher', '${t.id}')" class="text-blue-600 hover:text-blue-800 text-sm font-medium p-2"><i class="fa-solid fa-pen"></i> Редагувати</button>
                <button onclick="deleteUser('${t.id}')" class="text-red-500 hover:text-red-700 text-sm font-medium p-2"><i class="fa-solid fa-trash"></i> Видалити</button>
              </div>
            </div>
          `;
        }).join('') + `</div>`;
      }
      html += `</div>`;
      document.getElementById('content-area').innerHTML = html;
    }

    // СЕКЦІЯ УЧНІВ
    async function showStudentsSection() {
      await syncDataFromCloud();
      document.getElementById('btn-back').classList.remove('hidden');
      const students = (DB.users || []).filter(u => u.role === 'student');
      let html = `<div class="bg-white p-5 rounded-2xl border shadow-sm space-y-4"><div class="flex items-center justify-between"><h3 class="font-bold text-slate-800"><i class="fa-solid fa-user-graduate text-indigo-600 mr-2"></i>Учні</h3><button onclick="openUserModal('student')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-xl transition shadow"><i class="fa-solid fa-plus mr-1"></i> Додати учня</button></div>`;

      if (students.length === 0) {
        html += `<p class="text-slate-400 text-sm">Немає учнів.</p>`;
      } else {
        html += `<div class="divide-y">` + students.map(s => {
          const cls = (DB.classes || []).find(c => c.id === s.classId);
          return `
            <div class="py-3 flex items-center justify-between">
              <div>
                <div class="font-bold text-slate-800 flex items-center gap-2">
                  ${s.name}
                  ${s.isBlocked ? `<span class="text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold">Заблоковано</span>` : ''}
                </div>
                <div class="text-xs text-slate-500">Логін: <span class="font-semibold text-slate-700">${s.login}</span> | Пароль: <span class="font-semibold text-slate-700">${s.password}</span> | Клас: ${cls ? cls.name : 'Не вказано'}</div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="openUserModal('student', '${s.id}')" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium p-2"><i class="fa-solid fa-pen"></i> Редагувати</button>
                <button onclick="deleteUser('${s.id}')" class="text-red-500 hover:text-red-700 text-sm font-medium p-2"><i class="fa-solid fa-trash"></i> Видалити</button>
              </div>
            </div>
          `;
        }).join('') + `</div>`;
      }
      html += `</div>`;
      document.getElementById('content-area').innerHTML = html;
    }

    async function deleteUser(id) {
      if (!confirm('Ви впевнені, що хочете видалити цього користувача?')) return;
      DB.users = DB.users.filter(u => u.id !== id);
      await saveToCloud();
      showMainDashboard();
    }

    // ЗМІНА ПАРОЛЯ
    function toggleSettingsModal() {
      const modal = document.getElementById('modal-settings');
      modal.classList.toggle('hidden');
      document.getElementById('new-password-input').value = '';
      document.getElementById('change-pass-msg').innerText = currentUser.allowPassChange ? '' : 'Директор заборонив змінювати пароль.';
    }

    async function saveNewPassword() {
      if (!currentUser.allowPassChange && currentUser.role !== 'director') {
        alert('У вас немає дозволу на зміну пароля.');
        return;
      }
      const newPass = document.getElementById('new-password-input').value.trim();
      if (!newPass) return;

      const userInDb = DB.users.find(u => u.id === currentUser.id);
      if (userInDb) {
        userInDb.password = newPass;
        currentUser.password = newPass;
        await saveToCloud();
        alert('Пароль успішно змінено!');
        toggleSettingsModal();
      }
    }

    // КЛАСИ
    function openAddClassModal() { document.getElementById('modal-add-class').classList.remove('hidden'); document.getElementById('class-name-input').value = ''; }
    function closeAddClassModal() { document.getElementById('modal-add-class').classList.add('hidden'); }
    async function saveClass() {
      const name = document.getElementById('class-name-input').value.trim();
      if (!name) return;
      if (!DB.classes) DB.classes = [];
      DB.classes.push({ id: Date.now().toString(), name: name });
      await saveToCloud();
      closeAddClassModal();
      showMainDashboard();
    }

    // РОЗКЛАД
    async function showScheduleSection() {
      await syncDataFromCloud();
      document.getElementById('btn-back').classList.remove('hidden');

      let availableClasses = DB.classes || [];
      if (currentUser.role === 'teacher') {
        availableClasses = availableClasses.filter(c => c.id === currentUser.classId);
      }

      const isDirector = currentUser.role === 'director';

      let html = `
        <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
          <h3 class="font-bold text-slate-800"><i class="fa-solid fa-calendar-days text-amber-500 mr-2"></i>${isDirector ? 'Скласти розклад' : 'Розклад класу'}</h3>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Клас</label>
            <select id="schedule-class-select" onchange="loadScheduleText()" class="w-full px-3 py-2 border rounded-xl text-sm bg-white mb-3">
              ${availableClasses.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Розклад уроків</label>
            <textarea id="schedule-text" rows="6" ${isDirector ? '' : 'readonly'} class="w-full p-3 border rounded-xl text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none ${isDirector ? '' : 'bg-slate-50 text-slate-700'}" placeholder="Розклад поки не додано..."></textarea>
          </div>
          ${isDirector ? `<button onclick="saveSchedule()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-medium text-sm rounded-xl shadow">Зберегти розклад</button>` : ''}
        </div>
      `;
      document.getElementById('content-area').innerHTML = html;
      loadScheduleText();
    }

    function loadScheduleText() {
      const select = document.getElementById('schedule-class-select');
      if (!select) return;
      const classId = select.value;
      if (classId) document.getElementById('schedule-text').value = (DB.schedules && DB.schedules[classId]) ? DB.schedules[classId] : '';
    }

    async function saveSchedule() {
      const select = document.getElementById('schedule-class-select');
      if (!select) return;
      const classId = select.value;
      if (!DB.schedules) DB.schedules = {};
      DB.schedules[classId] = document.getElementById('schedule-text').value;
      await saveToCloud();
      alert('Розклад збережено!');
    }

    // ПРЕДМЕТИ
    async function showSubjectsSection() {
      await syncDataFromCloud();
      document.getElementById('btn-back').classList.remove('hidden');
      let html = `<div class="bg-white p-5 rounded-2xl border shadow-sm space-y-4"><h3 class="font-bold text-slate-800"><i class="fa-solid fa-book text-purple-600 mr-2"></i>Керування предметами</h3><div class="flex gap-2"><input type="text" id="new-subject-input" class="flex-1 px-3 py-2 border rounded-xl text-sm" placeholder="Назва предмета"><button onclick="addSubject()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium rounded-xl shadow">Додати</button></div><div class="divide-y pt-2">`;

      (DB.subjects || []).forEach((sub, idx) => {
        html += `<div class="py-2.5 flex items-center justify-between"><span class="text-sm font-semibold text-slate-700">${sub}</span><div class="flex items-center gap-2"><button onclick="editSubject(${idx})" class="text-slate-400 hover:text-blue-600 text-xs font-medium"><i class="fa-solid fa-pen"></i> Редагувати</button><button onclick="deleteSubject(${idx})" class="text-slate-400 hover:text-red-600 text-xs font-medium"><i class="fa-solid fa-trash"></i> Видалити</button></div></div>`;
      });
      html += `</div></div>`;
      document.getElementById('content-area').innerHTML = html;
    }

    async function addSubject() {
      const val = document.getElementById('new-subject-input').value.trim();
      if (!val) return;
      if (!DB.subjects) DB.subjects = [];
      DB.subjects.push(val);
      await saveToCloud();
      showSubjectsSection();
    }

    async function editSubject(idx) {
      const newName = prompt('Нова назва предмета:', DB.subjects[idx]);
      if (newName && newName.trim() !== '') {
        DB.subjects[idx] = newName.trim();
        await saveToCloud();
        showSubjectsSection();
      }
    }

    async function deleteSubject(idx) {
      if (!confirm('Видалити предмет?')) return;
      DB.subjects.splice(idx, 1);
      await saveToCloud();
      showSubjectsSection();
    }
  </script>
</body>
</html>
